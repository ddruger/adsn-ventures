<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADSN Ventures</title>
  <meta name="description" content="ADSN Ventures — get in touch.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --ink: #fff;
      --blue: #0ab4f0;
      --muted: #6b6b6b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 16px;
      gap: clamp(56px, 10vw, 120px);
    }

    /* Logo artwork has a pure black background, so it blends into the page */
    .logo {
      display: block;
      width: min(720px, 90vw);
      height: auto;
    }

    /* Button */
    .cta {
      display: inline-block;
      padding: 20px 44px;
      border-radius: 2px;
      background: var(--blue);
      color: #000;
      font-size: 18px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .cta:hover {
      background: #3cc6f5;
      transform: translateY(-2px);
    }

    .cta:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 4px;
    }

    footer {
      text-align: center;
      padding: 24px 16px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="ADSN Ventures" width="1366" height="442">

    <a class="cta" href="mailto:sean@adsnventures.com">Get In Touch</a>
  </main>

  <footer>&copy; <span id="year">2026</span> ADSN Ventures</footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
