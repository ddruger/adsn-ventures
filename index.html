<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADSN Ventures</title>
  <meta name="description" content="ADSN Ventures — get in touch.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Michroma&family=Saira:ital,wdth,wght@1,125,900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --ink: #fff;
      --blue: #0ab4f0;
      --muted: #6b6b6b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 16px;
      gap: clamp(56px, 10vw, 120px);
    }

    /* Logo */
    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(10px, 2vw, 22px);
    }

    /*
      The blue stripe is painted inside the letters with a single gradient
      across the whole word, so it sits at exactly the same height in every
      letter. Black bands on either side cut the letters, giving the
      "split" look.
    */
    .logo-word {
      display: inline-block;
      font-family: "Saira", "Arial Black", sans-serif;
      font-style: italic;
      font-weight: 900;
      font-stretch: 125%;
      font-variation-settings: "wdth" 125;
      font-size: clamp(64px, 20vw, 210px);
      line-height: 1;
      letter-spacing: -0.02em;
      padding: 0 0.08em;
      color: var(--ink);
      background: linear-gradient(
        to bottom,
        var(--ink) 0%,
        var(--ink) 52%,
        var(--bg) 52%,
        var(--bg) 54.5%,
        var(--blue) 54.5%,
        var(--blue) 59%,
        var(--bg) 59%,
        var(--bg) 61.5%,
        var(--ink) 61.5%,
        var(--ink) 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-sub {
      font-family: "Michroma", "Eurostile", sans-serif;
      font-size: clamp(12px, 3.6vw, 38px);
      letter-spacing: 0.95em;
      /* offset trailing letter-spacing so the word sits centered */
      padding-left: 0.95em;
      -webkit-text-stroke: 0.03em var(--ink);
      line-height: 1;
      color: var(--ink);
    }

    /* Button */
    .cta {
      display: inline-block;
      padding: 20px 44px;
      border-radius: 2px;
      background: var(--blue);
      color: #000;
      font-size: 18px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .cta:hover {
      background: #3cc6f5;
      transform: translateY(-2px);
    }

    .cta:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 4px;
    }

    footer {
      text-align: center;
      padding: 24px 16px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <div class="logo" role="img" aria-label="ADSN Ventures">
      <div class="logo-word" aria-hidden="true">ADSN</div>
      <div class="logo-sub" aria-hidden="true">VENTURES</div>
    </div>

    <a class="cta" href="mailto:sean@adsnventures.com">Get In Touch</a>
  </main>

  <footer>&copy; <span id="year">2026</span> ADSN Ventures</footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
