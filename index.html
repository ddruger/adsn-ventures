<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADSN Ventures</title>
  <meta name="description" content="ADSN Ventures — get in touch.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --ink: #fff;
      --blue: #0ab4f0;
      --muted: #6b6b6b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 16px;
      gap: clamp(28px, 4vw, 48px);
    }

    /* Logo artwork has a transparent background */
    .logo {
      position: relative;
      width: min(720px, 90vw);
      aspect-ratio: 1366 / 442;
    }

    .logo img {
      display: block;
      width: 100%;
      height: 100%;
    }

    /*
      Stripe sheen: a bright glint travels along the blue stripe every 8s.
      The overlay is masked to just the stripe (logo-stripe.png) so the
      white letters are untouched.
    */
    .logo-sheen {
      position: absolute;
      inset: 0;
      pointer-events: none;
      -webkit-mask: url("logo-stripe.png") center / 100% 100% no-repeat;
      mask: url("logo-stripe.png") center / 100% 100% no-repeat;
      background: linear-gradient(90deg, transparent 0%, rgba(160, 230, 255, 0.9) 40%, #fff 50%, rgba(160, 230, 255, 0.9) 60%, transparent 100%) no-repeat;
      background-size: 30% 100%;
      background-position: -50% 0;
      animation: sheen 8s ease-in-out infinite;
    }

    /* Sweep takes ~3s (first 37.5% of the 8s cycle), then rests until the next pass */
    @keyframes sheen {
      0% { background-position: -50% 0; }
      37.5%, 100% { background-position: 150% 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-sheen { animation: none; }
    }

    /*
      Grid reveal: a faint blue grid shows only in a circle around the mouse.
      Mouse devices only; touch screens never see it.
    */
    .cursor-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
      background-image:
        linear-gradient(rgba(10, 180, 240, 0.35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(10, 180, 240, 0.35) 1px, transparent 1px);
      background-size: 36px 36px;
      -webkit-mask: radial-gradient(circle 180px at var(--x, -999px) var(--y, -999px), #000 0%, transparent 100%);
      mask: radial-gradient(circle 180px at var(--x, -999px) var(--y, -999px), #000 0%, transparent 100%);
    }

    .cursor-grid.on { opacity: 1; }

    main, footer { position: relative; z-index: 1; }

    /* Button */
    .cta {
      display: inline-block;
      padding: 20px 44px;
      border-radius: 2px;
      background: var(--blue);
      color: #000;
      font-size: 18px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .cta:hover {
      background: #3cc6f5;
      transform: translateY(-2px);
    }

    .cta:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 4px;
    }

    footer {
      text-align: center;
      padding: 24px 16px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="cursor-grid" aria-hidden="true"></div>

  <main>
    <div class="logo">
      <img src="logo.png" alt="ADSN Ventures" width="1366" height="442">
      <div class="logo-sheen" aria-hidden="true"></div>
    </div>

    <a class="cta" href="mailto:sean@adsnventures.com">Get In Touch</a>
  </main>

  <footer>&copy; <span id="year">2026</span> ADSN Ventures</footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
      const grid = document.querySelector(".cursor-grid");
      document.addEventListener("pointermove", (e) => {
        grid.style.setProperty("--x", e.clientX + "px");
        grid.style.setProperty("--y", e.clientY + "px");
        grid.classList.add("on");
      });
      document.documentElement.addEventListener("pointerleave", () => grid.classList.remove("on"));
    }
  </script>
</body>
</html>
